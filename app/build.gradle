plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.maycon.faxina'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.maycon.faxina'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
